[project]
name = "broadbandmap-backend"
version = "0.1.0"
description = "Django backend for BroadbandMap: data model, ETL and API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]>=5.5,<6",
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "celery-types>=0.23",
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-django>=4.10",
    "ruff>=0.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"**/migrations/**" = ["E501", "RUF012"]
"**/models.py" = ["RUF012"]
"**/admin.py" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "--strict-markers -m 'not full_data'"
markers = [
    "full_data: reconciles a load of the real files in /data/raw (run with -m full_data)",
]
