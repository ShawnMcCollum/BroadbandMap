[project]
name = "broadbandmap-dashboard"
version = "0.1.0"
description = "Streamlit analyst dashboard for BroadbandMap"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "streamlit>=1.45,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["."]
